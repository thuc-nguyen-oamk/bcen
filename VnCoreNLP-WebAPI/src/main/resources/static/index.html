<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VnCoreNLP Web Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .panel h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.4em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        textarea {
            width: 100%;
            height: 200px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .options {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        
        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .output-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .output-container pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 0.85em;
            color: #666;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .entities-list {
            margin-top: 15px;
        }
        
        .entity-tag {
            display: inline-block;
            padding: 5px 12px;
            margin: 5px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .entity-PER { background: #ffebee; color: #c62828; }
        .entity-LOC { background: #e8f5e9; color: #2e7d32; }
        .entity-ORG { background: #fff3e0; color: #ef6c00; }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
        
        .format-selector {
            margin-left: auto;
        }
        
        select {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🇻🇳 VnCoreNLP Web Interface</h1>
            <p>Vietnamese Natural Language Processing - Word Segmentation | POS Tagging | NER | Dependency Parsing</p>
        </header>
        
        <div class="main-content">
            <div class="panel">
                <h2>📝 Input Text</h2>
                <textarea id="inputText" placeholder="Enter Vietnamese text here...&#10;&#10;Example: Ông Nguyễn Khắc Chúc đang làm việc tại Đại học Quốc gia Hà Nội."></textarea>
                
                <div class="options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="wseg" checked>
                        Word Segmentation
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="pos" checked>
                        POS Tagging
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="ner" checked>
                        Named Entity Recognition
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="parse" checked>
                        Dependency Parsing
                    </label>
                </div>
                
                <div class="btn-group">
                    <button class="btn-primary" id="processBtn" onclick="processText()">
                        ⚡ Process Text
                    </button>
                    <button class="btn-secondary" onclick="clearAll()">
                        🗑 Clear
                    </button>
                    <button class="btn-secondary" onclick="pasteFromClipboard()">
                        📋 Paste
                    </button>
                    <select id="outputFormat" class="format-selector">
                        <option value="json">JSON</option>
                        <option value="tabular">Tabular</option>
                    </select>
                </div>
            </div>
            
            <div class="panel">
                <h2>📊 Analysis Results</h2>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Processing your text...</p>
                </div>
                
                <div class="output-container" id="outputContainer">
                    <pre id="outputText">Results will appear here...</pre>
                </div>
                
                <div class="stats" id="stats" style="display: none;">
                    <div class="stat-item">
                        <div class="stat-value" id="sentenceCount">0</div>
                        <div class="stat-label">Sentences</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="wordCount">0</div>
                        <div class="stat-label">Words</div>
                    </div>
                </div>
                
                <div class="entities-list" id="entitiesList"></div>
                
                <div class="btn-group" style="margin-top: 15px;">
                    <button class="btn-secondary" onclick="copyResults()">
                        📄 Copy Results
                    </button>
                    <button class="btn-secondary" onclick="downloadResults()">
                        💾 Download
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api/v1';
        let lastResult = null;
        
        async function processText() {
            const text = document.getElementById('inputText').value.trim();
            if (!text) {
                alert('Please enter some text to analyze.');
                return;
            }
            
            const annotators = [];
            if (document.getElementById('wseg').checked) annotators.push('wseg');
            if (document.getElementById('pos').checked) annotators.push('pos');
            if (document.getElementById('ner').checked) annotators.push('ner');
            if (document.getElementById('parse').checked) annotators.push('parse');
            
            if (annotators.length === 0) {
                alert('Please select at least one annotation type.');
                return;
            }
            
            const format = document.getElementById('outputFormat').value;
            const endpoint = format === 'tabular' ? '/process/tabular' : '/process';
            
            // Show loading
            document.getElementById('loading').classList.add('active');
            document.getElementById('processBtn').disabled = true;
            document.getElementById('outputText').textContent = '';
            document.getElementById('stats').style.display = 'none';
            
            try {
                const response = await fetch(API_BASE + endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        annotators: annotators
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Processing failed');
                }
                
                lastResult = data;
                
                if (format === 'json') {
                    document.getElementById('outputText').textContent = JSON.stringify(data, null, 2);
                    
                    // Update stats
                    if (data.statistics) {
                        document.getElementById('sentenceCount').textContent = data.statistics.totalSentences;
                        document.getElementById('wordCount').textContent = data.statistics.totalWords;
                        document.getElementById('stats').style.display = 'flex';
                    }
                    
                    // Extract and display entities
                    extractAndDisplayEntities(data);
                } else {
                    document.getElementById('outputText').textContent = data;
                }
                
            } catch (error) {
                document.getElementById('outputText').innerHTML = 
                    '<div class="error-message">Error: ' + error.message + '</div>';
            } finally {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('processBtn').disabled = false;
            }
        }
        
        function extractAndDisplayEntities(data) {
            const entitiesList = document.getElementById('entitiesList');
            entitiesList.innerHTML = '';
            
            if (data.sentences && data.sentences.length > 0) {
                const entities = [];
                
                data.sentences.forEach(sentence => {
                    let currentEntity = null;
                    
                    sentence.words.forEach(word => {
                        if (word.ner.startsWith('B-')) {
                            if (currentEntity) {
                                entities.push(currentEntity);
                            }
                            currentEntity = {
                                text: word.text,
                                type: word.ner.substring(2)
                            };
                        } else if (word.ner.startsWith('I-') && currentEntity) {
                            currentEntity.text += ' ' + word.text;
                        } else {
                            if (currentEntity) {
                                entities.push(currentEntity);
                                currentEntity = null;
                            }
                        }
                    });
                    
                    if (currentEntity) {
                        entities.push(currentEntity);
                    }
                });
                
                if (entities.length > 0) {
                    entitiesList.innerHTML = '<strong>Named Entities:</strong>';
                    entities.forEach(entity => {
                        const tag = document.createElement('span');
                        tag.className = 'entity-tag entity-' + entity.type;
                        tag.textContent = entity.text + ' (' + entity.type + ')';
                        entitiesList.appendChild(tag);
                    });
                }
            }
        }
        
        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').textContent = 'Results will appear here...';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('entitiesList').innerHTML = '';
            lastResult = null;
        }
        
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('inputText').value = text;
            } catch (err) {
                alert('Unable to paste from clipboard. Please use Ctrl+V instead.');
            }
        }
        
        function copyResults() {
            const text = document.getElementById('outputText').textContent;
            if (text && text !== 'Results will appear here...') {
                navigator.clipboard.writeText(text).then(() => {
                    alert('Results copied to clipboard!');
                });
            }
        }
        
        function downloadResults() {
            if (!lastResult) {
                alert('No results to download.');
                return;
            }
            
            const format = document.getElementById('outputFormat').value;
            const content = format === 'json' ? 
                JSON.stringify(lastResult, null, 2) : 
                document.getElementById('outputText').textContent;
            
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'vncorenlp_results.' + (format === 'json' ? 'json' : 'txt');
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Allow Ctrl+Enter to process
        document.getElementById('inputText').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                processText();
            }
        });
    </script>
</body>
</html>
